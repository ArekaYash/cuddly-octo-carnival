name: Security SAST

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  security-events: write

env:
  PYTHONUTF8: "1"
  PYTHONIOENCODING: "utf-8"

jobs:
  scan:
    name: ${{ matrix.scanner }}
    runs-on: self-hosted

    strategy:
      fail-fast: false
      matrix:
        scanner:
          - semgrep
          - trivy
          - gitleaks
          - checkov

    env:
      REPORT_DIR: reports-${{ matrix.scanner }}

    steps:
      - uses: actions/checkout@v4

      - name: Enable UTF-8
        shell: cmd
        run: chcp 65001

      - name: Debug environment
        shell: cmd
        run: |
          whoami
          python --version
          semgrep --version
          trivy --version
          gitleaks version
          checkov --version

      - name: Prepare report directories
        shell: powershell
        run: |
          New-Item -ItemType Directory -Force `
            "$env:REPORT_DIR/raw" `
            "$env:REPORT_DIR/sarif" `
            "$env:REPORT_DIR/html" | Out-Null

      - name: Build SARIF converter (if required)
        shell: powershell
        run: |
          $converter = "C:\Users\yashm\OneDrive\Documents\sarif-converter\sarif-converter.exe"

          if (!(Test-Path $converter)) {
              Push-Location "C:\Users\yashm\OneDrive\Documents\sarif-converter"
              go build -o sarif-converter.exe ./main
              Pop-Location
          }

      - name: Run scanner
        shell: powershell
        continue-on-error: true
        run: |
          $scanner = "${{ matrix.scanner }}"

          switch ($scanner) {

            "semgrep" {

              semgrep scan `
                --config auto `
                --exclude reports `
                --json `
                --output "$env:REPORT_DIR/raw/semgrep.json" `
                .

              semgrep scan `
                --config auto `
                --exclude reports `
                --sarif `
                --output "$env:REPORT_DIR/sarif/semgrep.sarif" `
                .

            }

            "trivy" {

              trivy fs `
                --skip-version-check `
                --skip-dirs reports `
                --scanners vuln,secret,misconfig `
                --format json `
                --output "$env:REPORT_DIR/raw/trivy.json" `
                .

              trivy fs `
                --skip-version-check `
                --skip-dirs reports `
                --scanners vuln,secret,misconfig `
                --format sarif `
                --output "$env:REPORT_DIR/sarif/trivy.sarif" `
                .

            }

            "gitleaks" {

              gitleaks detect `
                --source . `
                --redact `
                --report-format json `
                --report-path "$env:REPORT_DIR/raw/gitleaks.json"

              gitleaks detect `
                --source . `
                --redact `
                --report-format sarif `
                --report-path "$env:REPORT_DIR/sarif/gitleaks.sarif"

            }

            "checkov" {

              $tmp = Join-Path $env:REPORT_DIR "temp"

              New-Item -ItemType Directory -Force $tmp | Out-Null

              checkov `
                -d . `
                --skip-path reports `
                -o json `
                --output-file-path $tmp

              Move-Item `
                "$tmp/results_json.json" `
                "$env:REPORT_DIR/raw/checkov.json" `
                -Force

              checkov `
                -d . `
                --skip-path reports `
                -o sarif `
                --output-file-path $tmp

              Move-Item `
                "$tmp/results_sarif.sarif" `
                "$env:REPORT_DIR/sarif/checkov.sarif" `
                -Force

              Remove-Item `
                $tmp `
                -Recurse `
                -Force

            }

          }

      - name: Generate HTML report
        shell: powershell
        continue-on-error: true
        run: |
          $sarif = Join-Path `
            "$env:REPORT_DIR/sarif" `
            ("${{ matrix.scanner }}.sarif")

          $html = Join-Path `
            "$env:REPORT_DIR/html" `
            ("${{ matrix.scanner }}.html")

          if (Test-Path $sarif) {

            & "C:\Users\yashm\OneDrive\Documents\sarif-converter\sarif-converter.exe" `
              --type html `
              $sarif `
              $html

          }

      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reports-${{ matrix.scanner }}
          path: ${{ env.REPORT_DIR }}

  collect_and_upload:
    needs: scan
    runs-on: self-hosted

    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: reports-*
          path: artifacts

      - name: Merge reports
        shell: powershell
        run: |
          New-Item -ItemType Directory -Force `
            reports/raw, `
            reports/sarif, `
            reports/html | Out-Null

          Get-ChildItem artifacts -Directory | ForEach-Object {

            if (Test-Path "$($_.FullName)/raw") {
              Copy-Item "$($_.FullName)/raw/*" reports/raw -Recurse -Force
            }

            if (Test-Path "$($_.FullName)/sarif") {
              Copy-Item "$($_.FullName)/sarif/*" reports/sarif -Recurse -Force
            }

            if (Test-Path "$($_.FullName)/html") {
              Copy-Item "$($_.FullName)/html/*" reports/html -Recurse -Force
            }

          }

      - name: Verify reports
        if: always()
        shell: powershell
        run: |
          Write-Host "===== RAW ====="
          Get-ChildItem reports/raw -Force

          Write-Host ""
          Write-Host "===== SARIF ====="
          Get-ChildItem reports/sarif -Force

          Write-Host ""
          Write-Host "===== HTML ====="
          Get-ChildItem reports/html -Force

      - name: Generate summary
        if: always()
        shell: powershell
        run: |
          @"
          # Security Scan Report

          | Scanner | Outputs |
          |----------|---------|
          | Semgrep | JSON, SARIF, HTML |
          | Trivy | JSON, SARIF, HTML |
          | Gitleaks | JSON, SARIF, HTML |
          | Checkov | JSON, SARIF, HTML |
          "@ | Set-Content reports/security-report.md

          Get-Content reports/security-report.md |
            Add-Content $env:GITHUB_STEP_SUMMARY

      - name: Upload SARIF
        if: always()
        continue-on-error: true
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: reports/sarif

      - name: Upload final reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: security-sast-report
          path: reports
