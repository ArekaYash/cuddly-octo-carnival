name: Security SAST

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  security-events: write

jobs:
  scan:
    runs-on: self-hosted

    steps:
      - uses: actions/checkout@v4

      - name: Debug scanner installation
        shell: cmd
        run: |
          echo ===== USER =====
          whoami

          echo ===== PATH =====
          echo %PATH%

          echo ===== SEMGREP =====
          where semgrep || echo SEMGREP NOT FOUND

          echo ===== TRIVY =====
          where trivy || echo TRIVY NOT FOUND

          echo ===== GITLEAKS =====
          where gitleaks || echo GITLEAKS NOT FOUND

          echo ===== CHECKOV =====
          where checkov || echo CHECKOV NOT FOUND

          echo ===== PYTHON =====
          where python || echo PYTHON NOT FOUND
          python --version || echo PYTHON FAILED

          echo ===== PIP =====
          where pip || echo PIP NOT FOUND

      - name: Prepare reports
        shell: cmd
        run: |
          if not exist reports\raw mkdir reports\raw
          if not exist reports\sarif mkdir reports\sarif

      - name: Semgrep
        shell: cmd
        continue-on-error: true
        run: |
          semgrep scan --config auto --json --output reports\raw\semgrep.json .
          semgrep scan --config auto --sarif --output reports\sarif\semgrep.sarif .

      - name: Trivy
        shell: cmd
        continue-on-error: true
        run: |
          trivy fs --scanners vuln,secret,misconfig --format json --output reports\raw\trivy.json .
          trivy fs --scanners vuln,secret,misconfig --format sarif --output reports\sarif\trivy.sarif .

      - name: Gitleaks
        shell: cmd
        continue-on-error: true
        run: |
          gitleaks detect --source . --redact --report-format json --report-path reports\raw\gitleaks.json
          gitleaks detect --source . --redact --report-format sarif --report-path reports\sarif\gitleaks.sarif

      - name: Checkov
        shell: cmd
        continue-on-error: true
        run: |
          checkov -d . -o json --output-file-path reports\raw\checkov.json
          checkov -d . -o sarif --output-file-path reports\sarif\checkov.sarif

      - name: Summary
        if: always()
        shell: cmd
        run: |
          > reports\security-report.md echo # Security SAST Report
          >> reports\security-report.md echo.
          >> reports\security-report.md echo Download the security-sast-report artifact for JSON/SARIF results.
          >> reports\security-report.md echo.
          >> reports\security-report.md echo ^| Scanner ^| Outputs ^|
          >> reports\security-report.md echo ^|---^|---^|
          >> reports\security-report.md echo ^| Semgrep ^| JSON, SARIF ^|
          >> reports\security-report.md echo ^| Trivy ^| JSON, SARIF ^|
          >> reports\security-report.md echo ^| Gitleaks ^| JSON, SARIF ^|
          >> reports\security-report.md echo ^| Checkov ^| JSON, SARIF ^|
          type reports\security-report.md >> "%GITHUB_STEP_SUMMARY%"

      - name: Upload SARIF
        if: always()
        uses: github/codeql-action/upload-sarif@v3
        continue-on-error: true
        with:
          sarif_file: reports/sarif

      - name: Upload report artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: security-sast-report
          path: reports/
